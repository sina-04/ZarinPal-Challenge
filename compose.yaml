services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
      args:
        ALLOW_DEMO_FALLBACK: ${ALLOW_DEMO_FALLBACK:-true}
        DATASET_URL: ${DATASET_URL:-https://startech.s3.ir-thr-at1.arvanstorage.ir/other%2Fchallenge_data.csv.gz?versionId=}
        DATASET_SHA256: ${DATASET_SHA256:-}
    environment:
      PORT: "8000"
      TZ: Asia/Tehran
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-only-change-me}
      DATASET_URL: ${DATASET_URL:-https://startech.s3.ir-thr-at1.arvanstorage.ir/other%2Fchallenge_data.csv.gz?versionId=}
      DATASET_SHA256: ${DATASET_SHA256:-}
      ALLOW_DEMO_FALLBACK: ${ALLOW_DEMO_FALLBACK:-true}
      DATA_DIR: /app/data
      DATABASE_PATH: /app/data/analytics.duckdb
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      TZ: Asia/Tehran
      API_HOSTPORT: api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-development-only-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-sol}
    ports:
      - "3000:3000"
    restart: unless-stopped
