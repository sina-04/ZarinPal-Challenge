[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "nabz-zarin-api"
version = "0.1.0"
description = "Traceable ZarinPal challenge merchant analytics API"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.1.3,<2",
  "fastapi>=0.115.0,<1",
  "jsonschema>=4.23.0,<5",
  "openpyxl>=3.1.5,<4",
  "pydantic>=2.9.0,<3",
  "uvicorn[standard]>=0.32.0,<1"
]

[project.optional-dependencies]
test = ["httpx>=0.27.2,<1", "pytest>=8.3.0,<9", "pytest-cov>=6.0.0,<7"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
